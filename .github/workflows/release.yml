name: Build & Publish Release

on:
  push:
    branches:
      - release
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Read version and keystore
        id: version
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION is empty."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          # Publishing a debug-signed artifact is worse than publishing nothing, so a missing
          # keystore fails the job instead of silently falling back to the debug key.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

          # Releases are immutable. Bump VERSION to publish the next one.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Bump VERSION to release again."
            exit 1
          fi
          echo "Releasing v$VERSION"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Package Source Code
        run: git archive --format=zip -o source.zip HEAD

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Bluetooth Quicktile ${{ steps.version.outputs.tag }}
          # Release output only. A **\/*.apk glob would also upload the debuggable debug build.
          artifacts: app/build/outputs/apk/release/BluetoothQuickTile-release.apk,source.zip
          generateReleaseNotes: true
          # The tag check above already rejected existing tags; this is the second line.
          allowUpdates: false