name: Build & Publish Release

on:
  push:
    branches:
      - release
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | cut -d '"' -f 2)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Package Source Code
        run: git archive --format=zip -o source.zip HEAD

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: "Bluetooth Quicktile ${{ steps.version.outputs.tag }}"
          artifacts: "app/build/outputs/apk/**/*.apk,source.zip"
          generateReleaseNotes: true
          allowUpdates: true
