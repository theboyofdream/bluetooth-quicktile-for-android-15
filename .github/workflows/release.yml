name: Build & Publish Release

on:
  push:
    branches:
      - release
    paths:
      - 'VERSION'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Read version and keystore
        id: version
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION is empty."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          # If a secret keystore is provided, decode it; otherwise generate a valid release keystore
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Using configured repository release keystore."
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set. Generating CI release signing keystore."
            keytool -genkeypair -v -keystore app/release.keystore -alias "${{ secrets.KEY_ALIAS || 'release' }}" -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ secrets.KEYSTORE_PASSWORD || 'android' }}" -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" -dname "CN=BluetoothQuickTile, OU=Android, O=OpenSource, L=Unknown, S=Unknown, C=US"
          fi

          # Releases are immutable. Bump VERSION to publish the next one.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::warning::Tag v$VERSION already exists locally."
          fi
          echo "Releasing v$VERSION"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Package Source Code
        run: git archive --format=zip -o source.zip HEAD

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Bluetooth Quicktile ${{ steps.version.outputs.tag }}
          # Release output only. A **/*.apk glob would also upload the debuggable debug build.
          artifacts: app/build/outputs/apk/release/BluetoothQuickTile-release.apk,source.zip
          generateReleaseNotes: true
          allowUpdates: true