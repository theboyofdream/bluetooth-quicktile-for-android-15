name: Build & Publish Release

on:
  push:
    branches:
      - release
    paths:
      - 'VERSION'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate version, tag and keystore
        id: version
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION is empty."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          # Releases are immutable. Bump VERSION to publish the next one. This has to fail the
          # job, not warn: the publish step leaves `allowUpdates` off, so a tag that already
          # exists would otherwise be republished and silently replace the download for everyone
          # who already has it.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Bump VERSION to publish a new release."
            exit 1
          fi
          echo "Releasing v$VERSION"

          # The signing key must be identical for every release, otherwise each APK has a
          # different signature and users cannot upgrade over the previous one. There is
          # deliberately no generated fallback: a key minted per run is unrecoverable, so the
          # next release would be uninstallable on top of this one. Failing here is loud and
          # cheap; publishing an APK nobody can update to is neither.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. A release must be signed with the repository keystore."
            exit 1
          fi
          for secret in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::$secret is not set. It is required alongside KEYSTORE_BASE64; there is no default in CI."
              exit 1
            fi
          done

          # .gitignore excludes *.keystore, so this cannot be committed by accident.
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Using the configured repository release keystore."

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Package Source Code
        run: git archive --format=zip -o source.zip HEAD

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Bluetooth Quicktile ${{ steps.version.outputs.tag }}
          # Release output only. A **/*.apk glob would also upload the debuggable debug build.
          artifacts: app/build/outputs/apk/release/BluetoothQuickTile-release.apk,source.zip
          generateReleaseNotes: true
          # Left unset on purpose. Overwriting a published release would swap the APK under
          # anyone who downloaded it, which for a signed build means an uninstallable upgrade.
          artifactErrorsFailBuild: true